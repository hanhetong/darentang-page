<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>达仁堂活动页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "SimSun", "Microsoft Yahei", serif;
        }
        body {
            background: #f8f3eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b2418;
        }
        .card {
            background: #fff8ee;
            border: 2px solid #b88646;
            padding: 45px 60px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(120, 60, 20, 0.15);
        }
        h1 {
            font-size: 40px;
            margin-bottom: 20px;
            color: #8c2c1e;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #9c2c1e;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: #782217;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>达仁堂 · 百年国药</h1>
        <p>传承百年匠心，守护大众健康<br>达仁堂主题活动展示页面</p>
        <a class="btn" href="#" target="_blank">了解更多</a>
    </div>
</body>
</html>
